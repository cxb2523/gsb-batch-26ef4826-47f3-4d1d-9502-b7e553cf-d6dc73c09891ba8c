<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example</title>
  <style>
    table {
      border-collapse: collapse;
      margin: 8px 0;
    }
    th, td {
      border: 1px solid #999;
      padding: 2px 8px;
      text-align: right;
    }
    #log {
      white-space: pre-wrap;
      font-family: monospace;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>audio-worklet-stream example</h1>
  <table>
    <tr>
      <th>Status</th>
      <td id="status">Ready</td>
    </tr>
    <tr>
      <th>Stop position</th>
      <td id="stopPosition">-</td>
    </tr>
    <tr>
      <th>Underrun events</th>
      <td id="underrunCount">0</td>
    </tr>
    <tr>
      <th>Accumulated silent frames</th>
      <td id="underrunFrames">0</td>
    </tr>
  </table>
  <button id="startManualButton">Start Stream (Manual / 1sec)</button>
  <button id="startTimerButton">Start Stream (UI Timer / mono)</button>
  <button id="startWorkerButton">Start Stream (Worker / stereo)</button>
  <button id="stopButton">Stop Stream</button>
  <button id="stopAtPositionButton">Stop at current position + 256 frames</button>
  <div id="log"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
