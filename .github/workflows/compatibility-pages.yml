name: Browser compatibility page
on:
  push:
    branches: [main]
    paths: ["compatibility/**", ".github/workflows/compatibility-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: compatibility-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v4
        with:
          path: compatibility
      - id: deploy
        uses: actions/deploy-pages@v4
