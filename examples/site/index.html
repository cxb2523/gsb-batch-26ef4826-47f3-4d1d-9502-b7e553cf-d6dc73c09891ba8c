<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bunny Hop Chronicles — bhop_ascent</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eef2ff;
      --dim: #9aa7c7;
      --accent: #5b8def;
      --good: #48c78e;
      --warn: #f59e0b;
      --panel: rgba(9, 13, 26, 0.86);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b1026;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      background: #0b1026;
    }
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-content: space-between;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }
    .hud-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .hud-row {
      display: flex;
      gap: 14px;
      align-items: baseline;
    }
    .hud-label {
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .hud-value {
      font-size: 20px;
      font-weight: 650;
    }
    .hud-time .hud-value { font-size: 30px; }
    .hud-best-right { text-align: right; }
    .hud-sync {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.05em;
      color: var(--accent);
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      background: radial-gradient(ellipse at center, rgba(11, 16, 38, 0.55), rgba(11, 16, 38, 0.94));
      backdrop-filter: blur(2px);
      transition: opacity 120ms ease;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay-card {
      max-width: 560px;
      pointer-events: none;
    }
    #overlay-title {
      margin: 0 0 10px;
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 750;
      letter-spacing: 0.01em;
    }
    #overlay-body {
      color: var(--dim);
      font-size: clamp(13px, 1.6vw, 16px);
      line-height: 1.6;
    }
    #pause-menu {
      position: absolute;
      top: 50%;
      right: 24px;
      transform: translateY(-50%);
      width: min(320px, calc(100vw - 48px));
      background: var(--panel);
      border: 1px solid rgba(91, 141, 239, 0.35);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    #pause-menu.hidden { display: none; }
    #pause-menu h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dim);
    }
    #pause-menu label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: var(--ink);
    }
    #pause-menu input[type="range"] { flex: 1; accent-color: var(--accent); }
    #pause-menu button {
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      background: rgba(91, 141, 239, 0.18);
      border: 1px solid rgba(91, 141, 239, 0.45);
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
    }
    #pause-menu button:hover { background: rgba(91, 141, 239, 0.3); }
    #pause-menu .danger { border-color: rgba(245, 158, 11, 0.5); background: rgba(245, 158, 11, 0.12); }
    #pause-menu .row { display: flex; gap: 8px; }
    #pause-menu .row button { flex: 1; }
    .keys {
      font-size: 12px;
      color: var(--dim);
      line-height: 1.7;
    }
    .keys kbd {
      font: inherit;
      font-size: 11px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      padding: 1px 5px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-block">
      <div class="hud-row hud-time">
        <span class="hud-label">Run</span>
        <span class="hud-value" id="hud-time">0:00.000</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Speed</span>
        <span class="hud-value" id="hud-speed">0 u/s</span>
        <span class="hud-label">Falls</span>
        <span class="hud-value" id="hud-falls">0</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">Next</span>
        <span class="hud-value" id="hud-pad">START</span>
        <span class="hud-label">Auto-hop</span>
        <span class="hud-value" id="hud-autohop">ON</span>
      </div>
    </div>
    <div class="hud-block hud-best-right">
      <span class="hud-label">Personal best</span>
      <span class="hud-value" id="hud-best">—</span>
      <span class="hud-label" style="margin-top: 6px">Strafe sync</span>
      <span class="hud-value hud-sync" id="hud-sync">░░░░░░░░░░</span>
    </div>
  </div>

  <div id="overlay">
    <div id="overlay-card">
      <h1 id="overlay-title">🐇 Bunny Hop Chronicles</h1>
      <p id="overlay-body"></p>
    </div>
  </div>

  <aside id="pause-menu" class="hidden">
    <h2>Pause menu</h2>
    <label>
      Auto-hop
      <input type="checkbox" id="pause-autohop" checked />
    </label>
    <label>
      Sensitivity
      <input type="range" id="pause-sensitivity" min="0.2" max="3" step="0.05" value="1" />
      <span id="pause-sensitivity-value">1.00×</span>
    </label>
    <div class="row">
      <button id="pause-toggle">Pause</button>
      <button id="pause-restart">Restart</button>
    </div>
    <button id="pause-clear" class="danger">Clear personal best</button>
    <div class="keys">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move ·
      <kbd>Space</kbd>/wheel jump · mouse steer ·
      <kbd>P</kbd> pause · <kbd>R</kbd> restart · <kbd>H</kbd> auto-hop
    </div>
  </aside>

  <script type="module" src="./game/main.js"></script>
</body>
</html>
